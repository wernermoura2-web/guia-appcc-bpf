name: Publicar Guia APPCC BPF
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências do guia
        run: python -m pip install 'PyMuPDF==1.26.6' 'pypdf>=6,<7' 'Pillow>=11,<13'
      - name: Gerar PDF editável e páginas do mesmo modelo de indicadores
        run: python -u tools/build_indicators.py
      - name: Conferir JavaScript
        run: |
          node --check config.js
          node --check app.js
          node --check paper.js
          node --check paper-data.js
      - name: Preparar somente os arquivos públicos do guia
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          target=Path('_site');target.mkdir()
          for p in Path('.').iterdir():
              if p.is_file() and (p.suffix in {'.html','.js','.css','.pdf','.png','.webmanifest'} or p.name=='.nojekyll') and not p.name.startswith('Simulacao_'):
                  shutil.copy2(p,target/p.name)
          shutil.copytree('paginas',target/'paginas')
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
