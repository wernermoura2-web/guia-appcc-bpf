name: Publicar Guia APPCC BPF
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'pypdf>=6,<7'
      - name: Atualizar dependências e considerações finais do PDF
        run: |
          cp tools/Guia_APPCC_BPF_Base.pdf Guia_APPCC_BPF.pdf
          python tools/legal_documents.py Guia_APPCC_BPF.pdf
          python tools/pcc_final_pdf.py Guia_APPCC_BPF.pdf
      - name: Preparar somente o guia APPCC anterior
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          target=Path('_site');target.mkdir()
          for p in Path('.').iterdir():
              if p.is_file() and (p.suffix in {'.html','.js','.css','.pdf','.png','.webmanifest'} or p.name=='.nojekyll') and not p.name.startswith('Simulacao_'):
                  shutil.copy2(p,target/p.name)
          shutil.copytree('paginas',target/'paginas')
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
