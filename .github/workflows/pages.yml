name: Publicar Guia APPCC BPF
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'pypdf>=6,<7' 'PyMuPDF==1.26.6' 'Pillow>=11,<13' 'reportlab>=4,<5'
      - name: Aplicar layout revisado às observações e rodapés
        run: |
          python tools/page8_notes_and_footers.py
          python tools/pop_labels.py
      # Os arquivos PDF, imagens e posições dos campos são revisados e versionados juntos.
      # Não recriar as páginas usando o modelo legado durante a publicação.
      - name: Validar o guia APPCC revisado sem sobrescrever os arquivos
        run: |
          node --check app.js
          node tools/test_inspector_guidance.cjs
          node --check inspector-orientations.js
          node --check orientacoes-inspetores.js
          node tools/test_orientation_review.cjs
          node tools/test_guidance_annex.cjs
          node tools/test_process_display.cjs
          node tools/test_paper_images.cjs
      - name: Preparar somente o guia APPCC anterior
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          target=Path('_site');target.mkdir()
          for p in Path('.').iterdir():
              if p.is_file() and (p.suffix in {'.html','.js','.css','.pdf','.png','.webmanifest'} or p.name=='.nojekyll') and not p.name.startswith('Simulacao_'):
                  shutil.copy2(p,target/p.name)
          shutil.copytree('paginas',target/'paginas')
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Aguardar publicação automática da mesma revisão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u - <<'PYWAIT'
          import json, os, time, urllib.request
          url = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs?head_sha=' + os.environ['GITHUB_SHA'] + '&per_page=100'
          for attempt in range(19):
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  runs = json.load(response)['workflow_runs']
              pending = [run for run in runs if run['id'] != int(os.environ['GITHUB_RUN_ID']) and run['name'] == 'pages build and deployment' and run['status'] != 'completed']
              if not pending:
                  print('Publicação automática concluída; publicar agora o PDF e as páginas gerados.')
                  break
              if attempt == 18:
                  raise SystemExit('Publicação automática ainda em execução; não disputar a implantação.')
              print('Aguardando publicação automática para evitar sobrescrita do PDF gerado.')
              time.sleep(10)
          PYWAIT
      - uses: actions/deploy-pages@v4
        id: deployment
