name: Publicar Guia APPCC BPF
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'pypdf>=6,<7' 'PyMuPDF==1.26.6' 'Pillow>=11,<13' 'reportlab>=4,<5'
      # O PDF editável inclui os protocolos L e já possui layout e aparências validados.
      # Publicar os arquivos versionados sem reaplicar a migração legada de 22 páginas.
      # Os arquivos PDF, imagens e posições dos campos são revisados e versionados juntos.
      # Não recriar as páginas usando o modelo legado durante a publicação.
      - name: Sincronizar classificações e fundamentos no PDF editável
        run: |
          python tools/sync_pdf_classification.py
          python tools/sync_cap_records_pdf.py
          python tools/sync_reservoir_split_pdf.py
          python tools/sync_hygiene_records_pdf.py
          python tools/sync_individual_phrases_pdf.py
          python tools/sync_quality_details_pdf.py
          python tools/sync_responsible_overview_pdf.py
          python tools/sync_missing_f_pdf.py
          python tools/clear_migration_notes_pdf.py
      - name: Atualizar materiais de revisão BPF e APPCC
        run: python tools/build_reference_pdfs.py
      - name: Validar o guia APPCC revisado sem sobrescrever os arquivos
        run: |
          node --check app.js
          node tools/test_cap_records.cjs
          node tools/test_reservoir_split.cjs
          node tools/test_hygiene_records.cjs
          node tools/test_individual_phrases.cjs
          node tools/test_quality_details.cjs
          node tools/test_responsible_details.cjs
          node tools/test_inspector_guidance.cjs
          node --check inspector-orientations.js
          node --check orientacoes-inspetores.js
          node tools/test_orientation_review.cjs
          node tools/test_guidance_annex.cjs
          node tools/test_process_display.cjs
          node tools/test_paper_images.cjs
      - name: Preparar somente o guia APPCC anterior
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          target=Path('_site');target.mkdir()
          for p in Path('.').iterdir():
              if p.is_file() and (p.suffix in {'.html','.js','.css','.pdf','.png','.webmanifest'} or p.name=='.nojekyll') and not p.name.startswith('Simulacao_'):
                  shutil.copy2(p,target/p.name)
          shutil.copytree('paginas',target/'paginas')
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment

